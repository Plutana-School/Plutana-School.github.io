<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Error 404</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=MS+PGothic&display=swap');

  body {
    background-color: #008080;
    font-family: 'MS PGothic', monospace, sans-serif;
    margin: 0;
    padding: 16px;
    color: black;
  }

  .window {
    width: 400px;
    border: 2px solid #000080;
    box-shadow:
      3px 3px 0 #c0c0c0,
      4px 4px 0 #fff,
      5px 5px 0 #808080;
    background-color: #c0c0c0;
    margin: 40px auto;
  }

  .title-bar {
    background: linear-gradient(to bottom, #000080, #0000cd);
    color: white;
    padding: 2px 8px;
    font-weight: bold;
    font-size: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    user-select: none;
  }

  /* Title bar buttons */
  .title-bar-controls {
    display: flex;
  }

  .title-bar-controls button {
    width: 18px;
    height: 18px;
    margin-left: 4px;
    background-color: #c0c0c0;
    border: 2px solid #fff;
    box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #808080;
    cursor: pointer;
    font-weight: bold;
    line-height: 14px;
    padding: 0;
  }

  .title-bar-controls button:active {
    border: 2px solid #808080;
    box-shadow: inset -1px -1px 0 #fff, inset 1px 1px 0 #808080;
  }

  /* Window content */
  .window-body {
    background-color: #fff;
    padding: 16px;
    font-size: 14px;
    border: 2px solid #fff;
    border-top: none;
  }

  h1 {
    font-size: 24px;
    margin-top: 0;
    margin-bottom: 12px;
  }

  .message {
    font-size: 14px;
    margin-bottom: 20px;
  }

  .btn {
    background-color: #c0c0c0;
    border: 2px solid #fff;
    box-shadow:
      inset 1px 1px 0 #fff,
      inset -1px -1px 0 #808080;
    padding: 6px 12px;
    font-family: 'MS PGothic', monospace, sans-serif;
    font-weight: bold;
    cursor: pointer;
    user-select: none;
  }

  .btn:active {
    box-shadow:
      inset -1px -1px 0 #fff,
      inset 1px 1px 0 #808080;
    border: 2px solid #808080;
  }

  .wisedom {
    font-family: 'MS PGothic', monospace, sans-serif;
    font-size: 12px;
    margin-bottom: 12px;
    height: 20px;
    white-space: nowrap;
    overflow: hidden;
    border: 1px solid #000080;
    background: #fff;
    padding: 2px 4px;
  }
</style>
</head>
<body>
  <div class="window" role="dialog" aria-labelledby="title" aria-modal="true">
    <div class="title-bar">
      <div id="title">Error 404</div>
      <div class="title-bar-controls">
        <button aria-label="Minimize" title="Minimize" onclick="alert('Minimize button pressed');">-</button>
        <button aria-label="Maximize" title="Maximize" onclick="alert('Maximize button pressed');">☐</button>
        <button aria-label="Close" title="Close" onclick="goHome()">X</button>
      </div>
    </div>
    <div class="window-body">
      <h1>Error 404</h1>
      <div class="message">The page you are looking for was not found.</div>
      <div class="wisedom" aria-live="polite"></div>
      <button class="btn" onclick="goHome()">Return Home</button>
    </div>
  </div>

<script>
  function goHome() {
    window.location.href = '/';
  }

  const wiseness = [
    'Welcome to the land of Nothing!',
    'Here there is absolutely nothing for you.',
    'I recommend you to go back home.',
    'Please. Go.',
    'Why are you here?',
    'I will not repeat this once more.',
    'GO. NOW.',
  ];
  const element = document.querySelector('.wisedom');
  let currentTextIndex = 0;
  let charIndex = 0;
  let typing = true;

  function type() {
    if (typing) {
      if (charIndex < wiseness[currentTextIndex].length) {
        element.textContent += wiseness[currentTextIndex].charAt(charIndex);
        charIndex++;
        setTimeout(type, 100);
      } else {
        typing = false;
        setTimeout(type, 3000);
      }
    } else {
      if (charIndex > 0) {
        element.textContent = wiseness[currentTextIndex].substring(0, charIndex - 1);
        charIndex--;
        setTimeout(type, 50);
      } else {
        typing = true;
        currentTextIndex = (currentTextIndex + 1) % wiseness.length;
        setTimeout(type, 500);
      }
    }
  }
  setTimeout(type, 1000);
</script>
</body>
</html>
