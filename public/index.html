<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Universal Proxy Client</title>
</head>
<body>
<h1>Universal Proxy Client</h1>
<form id="proxyForm">
  <label for="urlInput">Enter full URL to proxy:</label><br />
  <input
    type="url"
    id="urlInput"
    placeholder="https://example.com/api/data"
    style="width: 400px;"
    required
  />
  <button type="submit">Send Request</button>
</form>
<pre
  id="responseOutput"
  style="white-space: pre-wrap; border: 1px solid #ccc; padding: 1em; margin-top: 1em; max-height: 400px; overflow-y: auto;"
></pre>

<script>
  const form = document.getElementById('proxyForm');
  const output = document.getElementById('responseOutput');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    output.textContent = 'Loading...';
    const url = document.getElementById('urlInput').value;

    try {
      const proxyUrl = `/proxy?url=${encodeURIComponent(url)}`;
      const response = await fetch(proxyUrl);
      const text = await response.text();
      output.textContent = `Status: ${response.status}\n\n${text}`;
    } catch (error) {
      output.textContent = `Error: ${error.message}`;
    }
  });
</script>
</body>
</html>
